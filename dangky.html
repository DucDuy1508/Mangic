<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - Mangic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 mt-5">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center fw-bold mb-4" style="color: #222;">TẠO TÀI KHOẢN</h3>
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tài khoản</label>
                                <input type="text" id="regUser" class="form-control" required placeholder="Nhập tên tài khoản muốn tạo...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" id="regPass" class="form-control" required placeholder="Nhập mật khẩu...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Họ và tên</label>
                                <input type="text" id="regName" class="form-control" required placeholder="Nhập họ tên của bạn...">
                            </div>
                            
                            <button type="submit" class="btn btn-dark w-100 fw-bold py-2 mt-2">Đăng Ký</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="dangnhap.html" class="text-decoration-none text-muted" style="font-size: 14px;">← Đã có tài khoản? Đăng nhập</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TỰ ĐỘNG NHẬN DIỆN MÔI TRƯỜNG: Chạy máy nhà dùng localhost, lên Vercel dùng Render
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://localhost:5000"
            : "https://mangic.onrender.com";

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Thông báo đang xử lý dữ liệu
            Swal.fire({
                title: 'Hệ thống đang xử lý...',
                text: 'Vui lòng chờ trong giây lát.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // Gói dữ liệu gửi đi
            const payload = {
                username: document.getElementById('regUser').value.trim(),
                password: document.getElementById('regPass').value.trim(),
                fullName: document.getElementById('regName').value.trim(),
                role: "customer" // KHÓA CỨNG: Ép buộc tất cả người đăng ký từ giao diện đều là Customer
            };

            // ĐÃ SỬA: Thay thế link localhost tĩnh thành biến trỏ sang Render động
            fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Đăng ký thất bại',
                        text: 'Tên tài khoản này đã tồn tại trên hệ thống.',
                        confirmButtonColor: '#212529'
                    });
                } else {
                    Swal.fire({
                        icon: 'success',
                        title: 'Đăng ký thành công',
                        text: 'Tài khoản khách hàng của bạn đã được khởi tạo.',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        // Đăng ký xong đẩy họ quay lại trang Đăng Nhập để vào hệ thống
                        window.location.href = "dangnhap.html";
                    });
                }
            })
            .catch(err => {
                Swal.fire({
                    icon: 'error',
                    title: 'Lỗi kết nối',
                    text: 'Không thể kết nối đến máy chủ dịch vụ. Vui lòng thử lại sau.',
                    confirmButtonColor: '#dc3545'
                });
            });
        });
    </script>
</body>
</html>

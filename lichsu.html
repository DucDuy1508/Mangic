<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Mua Hàng - Mangic Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons@1.0.1-alpha.3/themify-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        .order-card { transition: all 0.2s; border: 1px solid #e0e0e0; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.08)!important; }
        .star-btn { transition: color 0.2s; }
        
        /* Style Chat */
        #chat-bubble { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #1e1e2d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: all 0.3s; }
        #chat-bubble:hover { transform: scale(1.05); background: #ffbc00; color: #1e1e2d; }
        #chat-box-container { position: fixed; bottom: 95px; right: 25px; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 1000; overflow: hidden; border: 1px solid #e0e0e0; transition: all 0.3s ease-in-out; }
        .chat-header { background: #1e1e2d; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffbc00; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .chat-footer { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #eee; background: white; }
        .msg-box { padding: 8px 12px; border-radius: 15px; max-width: 75%; font-size: 14px; word-break: break-word; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-wrapper { display: flex; width: 100%; margin-bottom: 2px; align-items: flex-start; }
        .msg-wrapper.customer { justify-content: flex-end; }
        .msg-wrapper.customer .msg-box { background: #ffbc00; color: black; border-bottom-right-radius: 2px; }
        .msg-wrapper.admin { justify-content: flex-start; }
        .msg-wrapper.admin .msg-box { background: #e9ecef; color: black; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="ti ti-shopping-cart text-warning me-2"></i>MANGIC SHOP</a>
            <div class="d-flex align-items-center">
                <span id="txtUserWelcome" class="text-light me-3 small fw-semibold"></span>
                <a href="index.html" class="btn btn-sm btn-outline-light"><i class="ti ti-arrow-left me-1"></i> Tiếp tục mua sắm</a>
            </div>
        </div>
    </nav>

    <div class="container my-3" style="max-width: 900px;">
        <div id="membershipCardContainer"></div>
    </div>

    <div class="container my-4" style="max-width: 900px;">
        <div class="d-flex align-items-center mb-4">
            <h2 class="fw-bold text-dark m-0"><i class="ti ti-time text-secondary me-2"></i>LỊCH SỬ ĐƠN HÀNG VÀ TRẠNG THÁI</h2>
        </div>
        <div id="orderHistoryContainer" class="d-flex flex-column gap-4">
            <div class="text-center py-5" id="loaderSpinner">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="text-muted mt-2">Đang tải lịch sử mua hàng của bạn...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="ti ti-star text-warning me-2"></i>Đánh giá đơn <span id="rv-orderCode" class="text-warning"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <h6 class="fw-bold mb-3">Bạn cảm thấy sản phẩm và dịch vụ thế nào?</h6>
                    <div id="star-rating-container" class="mb-3 fs-1" style="cursor: pointer; user-select: none;">
                        <span class="star-btn text-muted" data-val="1" onclick="setRating(1)">☆</span>
                        <span class="star-btn text-muted" data-val="2" onclick="setRating(2)">☆</span>
                        <span class="star-btn text-muted" data-val="3" onclick="setRating(3)">☆</span>
                        <span class="star-btn text-muted" data-val="4" onclick="setRating(4)">☆</span>
                        <span class="star-btn text-muted" data-val="5" onclick="setRating(5)">☆</span>
                    </div>
                    <input type="hidden" id="rv-rating" value="0">
                    <input type="hidden" id="rv-orderId" value="">
                    <textarea id="rv-text" class="form-control bg-light border-0 p-3" rows="3" placeholder="Chia sẻ cảm nhận của bạn về chất lượng truyện, bọc sách, shipper..."></textarea>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-dark w-100 fw-bold py-2" onclick="submitOrderReview()">GỬI ĐÁNH GIÁ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-bubble" onclick="toggleChatBox()"><i class="ti ti-comment"></i></div>
    <div id="chat-box-container">
        <div class="chat-header">
            <div class="d-flex flex-column w-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span><i class="ti ti-headphone-alt me-2"></i> Hỗ trợ Mangic Shop</span>
                    <button class="btn-close btn-close-white btn-sm" onclick="toggleChatBox()"></button>
                </div>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="chatMode" id="modeAdmin" checked>
                    <label class="btn btn-sm btn-outline-warning" for="modeAdmin" onclick="setChatMode('admin')">Admin</label>
                    <input type="radio" class="btn-check" name="chatMode" id="modeAI">
                    <label class="btn btn-sm btn-outline-warning" for="modeAI" onclick="setChatMode('ai')">AI Tư vấn</label>
                </div>
            </div>
        </div>
        <div class="chat-body d-flex flex-column gap-2" id="userChatBody"></div>
        <div class="chat-footer">
            <input type="text" id="userChatInput" class="form-control form-control-sm" placeholder="Nhập nội dung cần hỗ trợ...">
            <button class="btn btn-sm btn-dark px-3 fw-bold" onclick="sendUserMessage()">Gửi</button>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://localhost:5000" : "https://mangic.onrender.com";
        const LOGIC_SERVER = API_URL; // Dùng chung URL
        
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        let globalChatSocket;
        let currentMode = 'admin'; 
        let aiHistory = []; 

        // 1. KHỞI TẠO HỆ THỐNG KHI TẢI TRANG
        document.addEventListener("DOMContentLoaded", function() {
            if (!currentUser) {
                Swal.fire('Thông báo', 'Vui lòng đăng nhập!', 'warning').then(() => window.location.href = "dangnhap.html");
                return;
            }
            document.getElementById("txtUserWelcome").innerText = `Xin chào, ${currentUser.fullName || currentUser.username}`;
            
            initChat();
            loadMembershipCard();
            loadOrderHistory();
        });

        // 2. LOGIC CHAT REALTIME & AI
        function initChat() {
            globalChatSocket = io(LOGIC_SERVER, { transports: ['polling', 'websocket'], withCredentials: true });
            globalChatSocket.emit('join_room', currentUser.username);
            globalChatSocket.on('receive_message', function(msg) {
    // Chỉ in ra màn hình nếu người gửi là Admin (tin của khách đã tự in lúc bấm gửi rồi)
    if (currentMode === 'admin' && msg.sender === 'admin') {
        appendUserPageChatMessage(msg.sender, msg.text);
    }
});
        }

        function setChatMode(mode) {
            currentMode = mode;
            document.getElementById("userChatBody").innerHTML = ""; 
            if (mode === 'admin') syncUserChatHistory(); 
            else aiHistory.forEach(msg => appendUserPageChatMessage(msg.sender, msg.text));
        }

        function toggleChatBox() {
            const chatBoxContainer = document.getElementById("chat-box-container");
            if (chatBoxContainer.style.display === "none" || chatBoxContainer.style.display === "") {
                chatBoxContainer.style.display = "flex";
                if (currentMode === 'admin') syncUserChatHistory(); 
            } else {
                chatBoxContainer.style.display = "none";
            }
        }

        function syncUserChatHistory() {
            fetch(`${LOGIC_SERVER}/api/chat/history/${currentUser.username}`)
                .then(res => res.json())
                .then(messages => {
                    const chatBody = document.getElementById("userChatBody");
                    chatBody.innerHTML = ""; 
                    messages.forEach(msg => appendUserPageChatMessage(msg.sender, msg.text));
                });
        }

        async function sendUserMessage() {
            const chatInput = document.getElementById("userChatInput");
            const textContent = chatInput.value.trim();
            if (!textContent) return;

            appendUserPageChatMessage('customer', textContent);
            chatInput.value = ""; 

            if (currentMode === 'admin') {
                globalChatSocket.emit('send_message', { username: currentUser.username, sender: 'customer', text: textContent });
            } else {
                aiHistory.push({ sender: 'customer', text: textContent });
                const body = document.getElementById("userChatBody");
                
                // Hiệu ứng đang gõ
                const typingWrapper = document.createElement("div");
                typingWrapper.id = "ai-typing-indicator"; 
                typingWrapper.className = `msg-wrapper admin`;
                typingWrapper.innerHTML = `<div class="msg-box" style="display:flex;gap:4px;background:#e9ecef;"><span style="width:6px;height:6px;background:#6c757d;border-radius:50%;"></span><span style="width:6px;height:6px;background:#6c757d;border-radius:50%;"></span><span style="width:6px;height:6px;background:#6c757d;border-radius:50%;"></span></div>`;
                body.appendChild(typingWrapper);
                body.scrollTop = body.scrollHeight; 
                
                try {
                    const res = await fetch(`${LOGIC_SERVER}/api/ai-chat`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: textContent })
                    });
                    const data = await res.json();
                    document.getElementById("ai-typing-indicator")?.remove();
                    
                    let reply = data.reply ? data.reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') : "AI đang bận!";
                    aiHistory.push({ sender: 'admin', text: reply }); 
                    appendUserPageChatMessage('admin', reply);
                } catch (err) {
                    document.getElementById("ai-typing-indicator")?.remove();
                    appendUserPageChatMessage('admin', "Lỗi kết nối máy chủ AI Mangic!");
                }
            }
        }

        function appendUserPageChatMessage(sender, text) {
            const chatBody = document.getElementById("userChatBody");
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}`;
            wrapper.innerHTML = `<div class="msg-box">${text}</div>`;
            chatBody.appendChild(wrapper);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        document.getElementById("userChatInput")?.addEventListener("keypress", e => { if (e.key === 'Enter') sendUserMessage(); });

        // 3. LOGIC VIP & THỐNG KÊ CHI TIÊU
        function loadMembershipCard() {
            fetch(`${API_URL}/api/admin/customer-stats`)
            .then(res => res.json())
            .then(stats => {
                const myStat = stats.find(stat => stat.username === currentUser.username);
                const totalSpent = myStat ? myStat.totalSpent : 0;

                let tierName = "ĐỒNG 🥉", bgCard = "linear-gradient(135deg, #7f8c8d, #95a5a6)", nextTierText = `Tích lũy thêm <strong class="text-warning">${(500000 - totalSpent).toLocaleString('vi-VN')} đ</strong> lên BẠC 🥈`; 
                if (totalSpent >= 3000000) { tierName = "KIM CƯƠNG 💎"; bgCard = "linear-gradient(135deg, #4A00E0, #8E2DE2)"; nextTierText = `Chúc mừng bạn đạt hạng cao nhất!`; } 
                else if (totalSpent >= 1500000) { tierName = "VÀNG 🥇"; bgCard = "linear-gradient(135deg, #f1c40f, #f39c12)"; nextTierText = `Tích lũy thêm <strong class="text-warning">${(3000000 - totalSpent).toLocaleString('vi-VN')} đ</strong> lên KIM CƯƠNG 💎`; } 
                else if (totalSpent >= 500000) { tierName = "BẠC 🥈"; bgCard = "linear-gradient(135deg, #34495e, #2c3e50)"; nextTierText = `Tích lũy thêm <strong class="text-warning">${(1500000 - totalSpent).toLocaleString('vi-VN')} đ</strong> lên VÀNG 🥇`; }

                document.getElementById("membershipCardContainer").innerHTML = `
                    <div class="card text-white border-0 shadow-sm p-4 rounded-4 mb-4" style="background: ${bgCard}; position: relative; overflow: hidden;">
                        <div class="row align-items-center position-relative" style="z-index: 2;">
                            <div class="col-sm-7">
                                <span class="small fw-bold text-white-50"><i class="ti ti-crown me-1"></i> MANGIC SHOP MEMBERSHIP</span>
                                <h2 class="fw-bold mt-2">${currentUser.fullName || currentUser.username}</h2>
                                <div class="mt-3 text-white-50 small bg-black bg-opacity-25 py-2 px-3 rounded-3 d-inline-block">${nextTierText}</div>
                            </div>
                            <div class="col-sm-5 text-sm-end mt-3 mt-sm-0">
                                <span class="small text-white-50 fw-semibold">HẠNG THÀNH VIÊN</span>
                                <h1 class="m-0 text-white" style="font-weight: 900; font-size: 2.3rem;">${tierName}</h1>
                                <span class="badge bg-white text-dark mt-2 px-3 py-2 fw-bold shadow-sm">Đã chi tiêu: ${totalSpent.toLocaleString('vi-VN')} đ</span>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // 4. LOGIC LỊCH SỬ ĐƠN HÀNG + TRẢ HÀNG + ĐÁNH GIÁ
        function loadOrderHistory() {
            fetch(`${API_URL}/api/orders/history/${currentUser.username}`)
            .then(res => res.json())
            .then(orders => {
                const container = document.getElementById("orderHistoryContainer");
                container.innerHTML = ""; 
                if (orders.length === 0) {
                    container.innerHTML = `<div class="card p-5 text-center shadow-sm"><h5>Bạn chưa có đơn hàng nào!</h5><a href="index.html" class="btn btn-dark mt-3">MUA SẮM NGAY</a></div>`;
                    return;
                }

                orders.forEach(order => {
                    let finalPaymentStatus = order.orderStatus === 'Hủy đơn' ? 'Thất bại' : order.paymentStatus; 
                    
                    // Phối màu Status
                    let oStatusBadge = "bg-secondary"; 
                    if (order.orderStatus === "Đang giao") oStatusBadge = "bg-primary text-white"; 
                    if (order.orderStatus === "Đã giao") oStatusBadge = "bg-success text-white"; 
                    if (order.orderStatus === "Hủy đơn") oStatusBadge = "bg-danger text-white"; 
                    if (order.orderStatus === "Yêu cầu trả hàng") oStatusBadge = "bg-warning text-dark"; 
                    if (order.orderStatus === "Đã trả hàng") oStatusBadge = "bg-dark text-white"; 

                    let pStatusBadge = finalPaymentStatus === "Đã thanh toán" ? "bg-success text-white" : (finalPaymentStatus === "Thất bại" ? "bg-dark text-white" : "bg-warning text-dark"); 

                    let itemsHtml = order.items.map(item => `
                        <div class="d-flex justify-content-between mb-2 small border-bottom border-light">
                            <span><i class="ti ti-book text-muted me-2"></i>${item.name} <strong>x${item.quantity}</strong></span>
                            <span class="fw-semibold">${(item.price * item.quantity).toLocaleString('vi-VN')} đ</span>
                        </div>`).join('');

                    // Render Nút bấm (Hủy đơn / Trả hàng)
                    let actionBtns = "";
                    if (order.paymentMethod === 'COD' && order.orderStatus === 'Chờ xử lý') {
                        actionBtns += `<button class="btn btn-sm btn-outline-danger fw-bold ms-2" onclick="cancelMyOrder('${order._id}', '${order.orderCode}')">Hủy đơn</button>`;
                    }
                    if (order.orderStatus === 'Đã giao') {
                        actionBtns += `<button class="btn btn-sm btn-outline-warning text-dark fw-bold ms-2" onclick="requestReturnOrder('${order._id}', '${order.orderCode}')"><i class="ti ti-back-left"></i> Trả hàng</button>`;
                    }

                    // Render Đánh giá
                    let reviewHtml = "";
                    if (order.orderStatus === 'Đã giao' && finalPaymentStatus === 'Đã thanh toán') {
                        if (order.rating) {
                            const stars = '★'.repeat(order.rating) + '☆'.repeat(5 - order.rating);
                            reviewHtml = `<div class="mt-3 p-3 bg-light rounded border"><span class="fw-bold">Đánh giá: <span class="text-warning">${stars}</span></span><br><span class="text-muted small fst-italic">"${order.reviewText}"</span></div>`;
                        } else {
                            reviewHtml = `<div class="mt-3 text-end"><button class="btn btn-warning fw-bold btn-sm px-3" onclick="openReviewModal('${order._id}', '${order.orderCode}')"><i class="ti ti-star"></i> Viết đánh giá</button></div>`;
                        }
                    }

                    container.innerHTML += `
                        <div class="card border-0 shadow-sm p-4 mb-3">
                            <div class="d-flex justify-content-between border-bottom pb-3 mb-3">
                                <div><span class="text-muted small">Mã:</span> <strong class="fs-5">${order.orderCode}</strong></div>
                                <div>
                                    <span class="badge ${oStatusBadge} px-3 py-2">${order.orderStatus}</span>
                                    <span class="badge ${pStatusBadge} px-3 py-2">${finalPaymentStatus}</span>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-7 border-end">${itemsHtml} ${reviewHtml}</div>
                                <div class="col-md-5 small">
                                    <strong>Nhận hàng:</strong> ${order.shippingInfo?.fullName} <br>
                                    <strong>SĐT:</strong> ${order.shippingInfo?.phone} <br>
                                    <strong>ĐC:</strong> ${order.shippingInfo?.address}
                                </div>
                            </div>
                            <div class="d-flex justify-content-between border-top pt-3 mt-3 bg-light p-2 rounded">
                                <span class="small text-muted">Thanh toán: <strong>${order.paymentMethod}</strong></span>
                                <div>
                                    <span class="text-danger fw-bold fs-5">${order.totalAmount.toLocaleString('vi-VN')} đ</span>
                                    ${actionBtns}
                                </div>
                            </div>
                        </div>`;
                });
            });
        }

        // 5. CÁC HÀM XỬ LÝ (HỦY ĐƠN, TRẢ HÀNG, ĐÁNH GIÁ)
        function cancelMyOrder(orderId, orderCode) {
            Swal.fire({ title: 'Hủy đơn?', text: `Hủy đơn hàng ${orderCode}?`, icon: 'warning', showCancelButton: true, confirmButtonText: 'Đồng ý', cancelButtonText: 'Không' })
            .then((res) => {
                if (res.isConfirmed) {
                    fetch(`${API_URL}/api/orders/${orderId}/cancel`, { method: 'PUT', headers: { 'Content-Type': 'application/json' } })
                    .then(r => r.json()).then(data => { Swal.fire('Xong!', data.message, 'success').then(() => loadOrderHistory()); });
                }
            });
        }

        function requestReturnOrder(orderId, orderCode) {
            Swal.fire({ title: 'Yêu cầu trả hàng?', text: `Vui lòng nhắn tin cho Admin để cung cấp hình ảnh lý do sau khi xác nhận!`, icon: 'info', showCancelButton: true, confirmButtonText: 'Xác nhận trả', confirmButtonColor: '#ffbc00', cancelButtonText: 'Hủy' })
            .then((res) => {
                if (res.isConfirmed) {
                    fetch(`${API_URL}/api/orders/${orderId}/request-return`, { method: 'PUT' })
                    .then(r => r.json()).then(data => { 
                        Swal.fire('Đã báo cáo!', data.message, 'success').then(() => {
                            loadOrderHistory();
                            if (document.getElementById("chat-box-container").style.display === "none") toggleChatBox();
                        }); 
                    });
                }
            });
        }

        function openReviewModal(orderId, orderCode) {
            document.getElementById('rv-orderId').value = orderId;
            document.getElementById('rv-orderCode').innerText = "#" + orderCode;
            document.getElementById('rv-rating').value = 0;
            document.getElementById('rv-text').value = "";
            document.querySelectorAll('.star-btn').forEach(s => { s.innerText = '☆'; s.classList.replace('text-warning', 'text-muted'); });
            new bootstrap.Modal(document.getElementById('reviewModal')).show();
        }

        function setRating(val) {
            document.getElementById('rv-rating').value = val;
            document.querySelectorAll('.star-btn').forEach(s => {
                let sVal = parseInt(s.getAttribute('data-val'));
                s.innerText = sVal <= val ? '★' : '☆';
                sVal <= val ? s.classList.replace('text-muted', 'text-warning') : s.classList.replace('text-warning', 'text-muted');
            });
        }

        function submitOrderReview() {
            const orderId = document.getElementById('rv-orderId').value;
            const rating = document.getElementById('rv-rating').value;
            const reviewText = document.getElementById('rv-text').value.trim();
            if (rating == 0) return Swal.fire('Lưu ý', 'Vui lòng chọn số sao!', 'warning');

            fetch(`${API_URL}/api/orders/${orderId}/review`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rating, reviewText })
            }).then(res => res.json()).then(data => {
                Swal.fire('Cảm ơn bạn!', 'Đánh giá đã được ghi nhận.', 'success').then(() => loadOrderHistory());
            });
        }
    </script>
</body>
</html>

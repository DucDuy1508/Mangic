<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Mua Hàng - Mangic Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons@1.0.1-alpha.3/themify-icons.min.css">
    <style>
        .order-card { transition: all 0.2s; border: 1px solid #e0e0e0; }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.08)!important; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
        <div class="container px-4">
            <a class="navbar-brand fw-bold fs-4" href="index.html"><i class="ti ti-shopping-cart text-warning me-2"></i>MANGIC SHOP</a>
            <div class="d-flex align-items-center">
                <span id="txtUserWelcome" class="text-light me-3 small fw-semibold"></span>
                <a href="index.html" class="btn btn-sm btn-outline-light"><i class="ti ti-arrow-left me-1"></i> Tiếp tục mua sắm</a>
            </div>
        </div>
    </nav>

    <div class="container my-3" style="max-width: 900px;">
        <div id="membershipCardContainer"></div>
    </div>

    <div class="container my-4" style="max-width: 900px;">
        <div class="d-flex align-items-center mb-4">
            <h2 class="fw-bold text-dark m-0"><i class="ti ti-time text-secondary me-2"></i>LỊCH SỬ ĐƠN HÀNG VÀ TRẠNG THÁI</h2>
        </div>

        <div id="orderHistoryContainer" class="d-flex flex-column gap-4">
            <div class="text-center py-5" id="loaderSpinner">
                <div class="spinner-border text-dark" role="status"></div>
                <p class="text-muted mt-2">Đang tải lịch sử mua hàng của bạn...</p>
            </div>
        </div>
    </div>
<!-- =================================================== -->
<!-- KHỐI GIAO DIỆN BONG BÓNG CHAT REALTIME ĐỒNG BỘ ĐA TRANG -->
<!-- =================================================== -->
<div id="chat-bubble" onclick="toggleChatBox()"><i class="ti ti-comment"></i></div>

<div id="chat-box-container">
    <div class="chat-header">
        <span><i class="ti ti-headphone-alt me-2"></i> Hỗ trợ Mangic Shop</span>
        <button class="btn-close btn-close-white btn-sm" onclick="toggleChatBox()"></button>
    </div>
    <div class="chat-body d-flex flex-column gap-2" id="userChatBody"></div>
    <div class="chat-footer">
        <input type="text" id="userChatInput" class="form-control form-control-sm" placeholder="Nhập nội dung cần hỗ trợ...">
        <button class="btn btn-sm btn-dark px-3 fw-bold" onclick="sendUserMessage()">Gửi</button>
    </div>
</div>

<!-- Tải CSS Tùy biến hộp chat ẩn hiện mượt mà dính cứng góc phải màn hình -->
<style>
    #chat-bubble { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #1e1e2d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: all 0.3s; }
    #chat-bubble:hover { transform: scale(1.05); background: #ffbc00; color: #1e1e2d; }
    #chat-box-container { position: fixed; bottom: 95px; right: 25px; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 1000; overflow: hidden; border: 1px solid #e0e0e0; transition: all 0.3s ease-in-out; }
    .chat-header { background: #1e1e2d; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffbc00; }
    .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-column; gap: 10px; }
    .chat-footer { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #eee; background: white; }
    
    /* Style tin nhắn co giãn ôm khít text chữ chặn đứng lỗi cột đình */
    .msg-box { padding: 8px 12px; border-radius: 15px; max-width: 75%; font-size: 14px; word-break: break-word; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .msg-wrapper { display: flex; w-100: 100%; mb-2: 2px; align-items: start; }
    .msg-wrapper.customer { justify-content: flex-end; }
    .msg-wrapper.customer .msg-box { background: #ffbc00; color: black; border-bottom-right-radius: 2px; }
    .msg-wrapper.admin { justify-content: flex-start; }
    .msg-wrapper.admin .msg-box { background: #e9ecef; color: black; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; }
</style>

<!-- Nhúng thư viện Socket.IO Client chính thức (Nếu trang nào có sẵn rồi thì bỏ dòng này nha) -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
    // Tự động nhận diện môi trường local/online để trỏ API chuẩn xác
    const LOGIC_SERVER = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
        ? "http://localhost:5000"
        : "https://mangic.onrender.com";
        
    let globalChatSocket;
    const currentLoggedUser = JSON.parse(localStorage.getItem("currentUser"));

    // Khởi động luồng lắng nghe ngầm đa trang khi phát hiện session đăng nhập
    if (currentLoggedUser) {
        // Đồng bộ cấu hình kết nối Polling để Render Cloud không chặn luồng chat
        globalChatSocket = io(LOGIC_SERVER, {
            transports: ['polling', 'websocket'],
            withCredentials: true
        });
        
        // Đăng ký quyền tham gia vào căn phòng biệt lập mang tên username của chính mình
        globalChatSocket.emit('join_room', currentLoggedUser.username);

        // Ngóng tin phản hồi Realtime từ Admin dội về bất thình lình khi đang lướt đa trang
        globalChatSocket.on('receive_message', function(msg) {
            appendUserPageChatMessage(msg.sender, msg.text);
        });
    }

    // Cơ chế đóng mở hộp chat ma thuật
    function toggleChatBox() {
        if (!currentLoggedUser) {
            Swal.fire('Yêu cầu định danh', 'Vui lòng đăng nhập tài khoản để kết nối với bộ phận hỗ trợ khách hàng!', 'warning');
            return;
        }
        const chatBoxContainer = document.getElementById("chat-box-container");
        if (chatBoxContainer.style.display === "none" || chatBoxContainer.style.display === "") {
            chatBoxContainer.style.display = "flex";
            syncUserChatHistory(); // Mở hộp chat ở bất kỳ trang nào -> Bốc dỡ đồng bộ lịch sử cũ ngay!
        } else {
            chatBoxContainer.style.display = "none";
        }
    }

    // Hàm chọc API kéo lịch sử trò chuyện lưu vết từ MongoDB Atlas lên màn hình
    function syncUserChatHistory() {
        fetch(`${LOGIC_SERVER}/api/chat/history/${currentLoggedUser.username}`)
            .then(res => res.json())
            .then(messages => {
                const chatBody = document.getElementById("userChatBody");
                chatBody.innerHTML = ""; // Làm sạch khung hình tránh dính lặp tin nhắn
                messages.forEach(msg => appendUserPageChatMessage(msg.sender, msg.text));
            })
            .catch(err => console.error("Lỗi đồng bộ lịch sử đa trang:", err));
    }

    // Đóng gói dữ liệu bắn lên mây máy chủ thời gian thực
    function sendUserMessage() {
        const chatInput = document.getElementById("userChatInput");
        const textContent = chatInput.value.trim();
        if (!textContent) return;

        // Truyền tin qua cổng socket
        globalChatSocket.emit('send_message', {
            username: currentLoggedUser.username,
            sender: 'customer',
            text: textContent
        });
        
        chatInput.value = ""; // Clear thanh gõ
    }

    // Hàm vẽ bong bóng chat trái/phải ôm sát chữ chuẩn UX
    function appendUserPageChatMessage(sender, text) {
        const chatBody = document.getElementById("userChatBody");
        if (!chatBody) return;

        const wrapper = document.createElement("div");
        wrapper.className = `msg-wrapper ${sender}`;

        const msgDiv = document.createElement("div");
        msgDiv.className = "msg-box";
        msgDiv.innerHTML = text;

        wrapper.appendChild(msgDiv);
        chatBody.appendChild(wrapper);
        
        // Luôn cuộn chuột mượt xuống đáy cuộc trò chuyện mới nhất
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Bắt phím Enter gửi tin nhắn thần tốc
    document.getElementById("userChatInput")?.addEventListener("keypress", function(e) {
        if (e.key === 'Enter') {
            sendUserMessage();
        }
    });
</script>
    <script>
        // Khai báo biến toàn cục API_URL để các hàm độc lập có thể bốc sử dụng chung
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://localhost:5000"
            : "https://mangic.onrender.com";

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Kiểm tra quyền đăng nhập tài khoản khách hàng
            const currentUser = JSON.parse(localStorage.getItem("currentUser"));
            if (!currentUser) {
                Swal.fire('Thông báo', 'Vui lòng đăng nhập để xem lịch sử mua hàng!', 'warning').then(() => {
                    window.location.href = "dangnhap.html";
                });
                return;
            }

            // Đổ tên chào mừng khách hàng lên thanh điều hướng navbar
            document.getElementById("txtUserWelcome").innerText = `Xin chào, ${currentUser.fullName || currentUser.username}`;

            // Kích hoạt gọi đồng thời hai luồng tải dữ liệu độc lập qua API đám mây
            loadMembershipCard();
            loadOrderHistory();

            // 2. HÀM XỬ LÝ BIỂU DIỄN THỂ VIP THÀNH VIÊN
            function loadMembershipCard() {
                fetch(`${API_URL}/api/admin/customer-stats`)
                .then(res => res.json())
                .then(stats => {
                    const myStat = stats.find(stat => stat.username === currentUser.username);
                    const totalSpent = myStat ? myStat.totalSpent : 0;

                    let tierName = "ĐỒNG 🥉";
                    let nextTierText = "";
                    let bgCard = "linear-gradient(135deg, #7f8c8d, #95a5a6)"; 

                    if (totalSpent >= 3000000) {
                        tierName = "KIM CƯƠNG 💎";
                        nextTierText = `<span class="text-warning fw-bold"><i class="ti ti-gift me-1"></i> Chúc mừng tối cao!</span> Bạn đã đạt cấp độ thành viên cao nhất.`;
                        bgCard = "linear-gradient(135deg, #4A00E0, #8E2DE2)"; 
                    } else if (totalSpent >= 1500000) {
                        tierName = "VÀNG 🥇";
                        const sotiencan = (3000000 - totalSpent).toLocaleString('vi-VN');
                        nextTierText = `Tích lũy thêm <strong class="text-warning fs-6">${sotiencan} đ</strong> để mở khóa đặc quyền <strong class="text-info">KIM CƯƠNG 💎</strong>`;
                        bgCard = "linear-gradient(135deg, #f1c40f, #f39c12)"; 
                    } else if (totalSpent >= 500000) {
                        tierName = "BẠC 🥈";
                        const sotiencan = (1500000 - totalSpent).toLocaleString('vi-VN');
                        nextTierText = `Tích lũy thêm <strong class="text-warning fs-6">${sotiencan} đ</strong> để mở khóa đặc quyền <strong class="text-warning">VÀNG 🥇</strong>`;
                        bgCard = "linear-gradient(135deg, #34495e, #2c3e50)"; 
                    } else {
                        tierName = "ĐỒNG 🥉";
                        const sotiencan = (500000 - totalSpent).toLocaleString('vi-VN');
                        nextTierText = `Tích lũy thêm <strong class="text-warning fs-6">${sotiencan} đ</strong> để mở khóa đặc quyền <strong style="color: #00f0ff; font-weight: bold;">BẠC 🥈</strong>`;
                        bgCard = "linear-gradient(135deg, #5D5D5D, #3A3A3A)"; 
                    }

                    document.getElementById("membershipCardContainer").innerHTML = `
                        <div class="card text-white border-0 shadow-sm p-4 rounded-4 mb-4" style="background: ${bgCard}; position: relative; overflow: hidden;">
                            <div style="position: absolute; right: -20px; bottom: -30px; font-size: 150px; opacity: 0.08; pointer-events: none;">
                                <i class="ti ti-crown"></i>
                            </div>
                            
                            <div class="row align-items-center position-relative" style="z-index: 2;">
                                <div class="col-sm-7">
                                    <span class="text-uppercase small fw-bold text-white-50 d-block tracking-wider" style="letter-spacing: 1.5px; font-size: 11px;">
                                        <i class="ti ti-crown me-1"></i> MANGIC SHOP - MEMBERSHIP CARD
                                    </span>
                                    <h2 class="fw-bold mt-2 mb-1" style="letter-spacing: -0.5px;">${currentUser.fullName || currentUser.username}</h2>
                                    <div class="mt-3 text-white-50 small bg-black bg-opacity-25 py-2 px-3 rounded-3 d-inline-block border border-white border-opacity-10">
                                        ${nextTierText}
                                    </div>
                                </div>
                                <div class="col-sm-5 text-sm-end mt-3 mt-sm-0">
                                    <span class="small d-block text-white-50 fw-semibold">HẠNG THÀNH VIÊN</span>
                                    <h1 class="m-0 text-white" style="font-weight: 900; font-size: 2.3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">${tierName}</h1>
                                    <span class="badge bg-white text-dark mt-2 px-3 py-2 fw-bold shadow-sm" style="font-size: 13px;">
                                        <i class="ti ti-wallet me-1 text-secondary"></i> Đã chi tiêu: ${totalSpent.toLocaleString('vi-VN')} đ
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                })
                .catch(err => console.error("Lỗi tải thông tin thành viên VIP:", err));
            }

            // 3. HÀM TẢI LỊCH SỬ ĐƠN HÀNG CHI TIẾT (ĐÃ ĐỒNG BỘ WEBHOOK ĐỘNG)
            function loadOrderHistory() {
                fetch(`${API_URL}/api/orders/history/${currentUser.username}`)
                .then(res => res.json())
                .then(orders => {
                    const container = document.getElementById("orderHistoryContainer");
                    container.innerHTML = ""; 

                    if (orders.length === 0) {
                        container.innerHTML = `
                            <div class="card border-0 shadow-sm p-5 text-center bg-white rounded-3">
                                <i class="ti ti-package text-muted mb-3" style="font-size: 50px;"></i>
                                <h4 class="fw-bold text-secondary">Bạn chưa có đơn hàng nào!</h4>
                                <p class="text-muted">Hãy quay lại trang chủ để chọn cho mình những bộ truyện ưng ý nhất nhé.</p>
                                <a href="index.html" class="btn btn-dark fw-bold px-4 py-2 mt-2 mx-auto">MUA SẮM NGAY</a>
                            </div>
                        `;
                        return;
                    }

                    orders.forEach(order => {
                        let finalPaymentStatus = order.paymentStatus; 
                        if (order.orderStatus === 'Hủy đơn') {
                            finalPaymentStatus = 'Thất bại';
                        }

                        // --- Phối màu Trạng thái đơn hàng (orderStatus) ---
                        let oStatusBadge = "bg-secondary"; 
                        if (order.orderStatus === "Đang giao") oStatusBadge = "bg-primary text-white"; 
                        if (order.orderStatus === "Đã giao") oStatusBadge = "bg-success text-white"; 
                        if (order.orderStatus === "Hủy đơn") oStatusBadge = "bg-danger text-white"; 

                        // --- Phối màu Tình trạng thanh toán (paymentStatus) ---
                        let pStatusBadge = "bg-warning text-dark"; 
                        if (finalPaymentStatus === "Đã thanh toán") pStatusBadge = "bg-success text-white"; 
                        if (finalPaymentStatus === "Thất bại") pStatusBadge = "bg-dark text-white"; 

                        let itemsHtml = order.items.map(item => `
                            <div class="d-flex justify-content-between align-items-center mb-2 small pb-1 border-bottom border-light">
                                <span><i class="ti ti-book text-muted me-2"></i>${item.name} <strong class="text-secondary">x${item.quantity}</strong></span>
                                <span class="fw-semibold text-dark">${(item.price * item.quantity).toLocaleString('vi-VN')} đ</span>
                            </div>
                        `).join('');

                        const orderDate = new Date(order.createdAt).toLocaleString('vi-VN', {
                            hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric'
                        });

                        // ĐÃ NÂNG CẤP: Kiểm tra điều kiện nghiêm ngặt để sinh nút "Hủy đơn hàng"
                        let cancelBtnHtml = "";
                        if (order.paymentMethod === 'COD' && order.orderStatus === 'Chờ xử lý') {
                            cancelBtnHtml = `
                                <button class="btn btn-sm btn-outline-danger fw-bold px-3 ms-2 shadow-sm rounded-2" onclick="cancelMyOrder('${order._id}', '${order.orderCode}')">
                                    <i class="ti ti-close me-1"></i> Hủy đơn hàng
                                </button>
                            `;
                        }

                        const orderCard = `
                            <div class="card order-card border-0 shadow-sm bg-white p-4 rounded-3">
                                <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-3 mb-3 gap-2">
                                    <div>
                                        <span class="text-muted small">Mã đơn hàng:</span>
                                        <span class="fw-bold text-dark fs-5 ms-1">${order.orderCode}</span>
                                        <div class="text-muted mt-1" style="font-size: 12px;"><i class="ti ti-calendar me-1"></i>Thời gian: ${orderDate}</div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <span class="badge ${oStatusBadge} px-3 py-2 fw-bold" style="font-size: 12px;"><i class="ti ti-truck me-1"></i>${order.orderStatus || 'Chờ xử lý'}</span>
                                        <span class="badge ${pStatusBadge} px-3 py-2 fw-bold" style="font-size: 12px;"><i class="ti ti-wallet me-1"></i>${finalPaymentStatus}</span>
                                    </div>
                                </div>

                                <div class="row g-4">
                                    <div class="col-md-7 border-end">
                                        <span class="text-muted small fw-bold mb-2 d-block">DANH SÁCH TRUYỆN ĐÃ CHỌN</span>
                                        <div style="max-height: 150px; overflow-y: auto;" class="pe-2">
                                            ${itemsHtml}
                                        </div>
                                    </div>
                                    <div class="col-md-5" style="font-size: 13px;">
                                        <span class="text-muted small fw-bold mb-2 d-block">ĐỊA CHỈ NHẬN HÀNG</span>
                                        <div class="fw-bold text-dark"><i class="ti ti-user me-1 text-muted"></i>${order.shippingInfo?.fullName || 'N/A'}</div>
                                        <div class="text-secondary mt-1"><i class="ti ti-mobile me-1 text-muted"></i>SĐT: ${order.shippingInfo?.phone || 'N/A'}</div>
                                        <div class="text-secondary mt-1 text-truncate" style="max-width: 100%;" title="${order.shippingInfo?.address}"><i class="ti ti-location-pin me-1 text-muted"></i>ĐC: ${order.shippingInfo?.address || 'N/A'}</div>
                                    </div>
                                </div>

                                <div class="row d-flex justify-content-between align-items-center border-top pt-3 mt-3 bg-light p-2 rounded mx-0">
                                    <span class="col-sm-7 small text-muted px-0">Hình thức: <strong class="text-dark">${order.paymentMethod === 'QR' ? 'Chuyển khoản ngân hàng (QR)' : 'Thanh toán COD khi nhận hàng'}</strong></span>
                                    <div class="col-sm-5 text-sm-end px-0 mt-2 mt-sm-0 d-flex align-items-center justify-content-sm-end justify-content-between">
                                        <div>
                                            <span class="text-muted small">Tổng tiền:</span>
                                            <span class="fw-bold text-danger fs-5 ms-1">${order.totalAmount.toLocaleString('vi-VN')} đ</span>
                                        </div>
                                        ${cancelBtnHtml}
                                    </div>
                                </div>
                            </div>
                        `;
                        container.innerHTML += orderCard;
                    });
                })
                .catch(err => {
                    console.error("Lỗi:", err);
                    document.getElementById("orderHistoryContainer").innerHTML = `<div class="alert alert-danger text-center">Gặp sự cố kết nối, không thể bốc dữ liệu lịch sử đơn!</div>`;
                });
            }
        });

        // 4. HÀM MỚI CHUYÊN NGHIỆP: USER GỬI YÊU CẦU HỦY ĐƠN HÀNG COD LÊN BACKEND
        function cancelMyOrder(orderId, orderCode) {
            Swal.fire({
                title: 'Xác nhận hủy đơn?',
                text: `Bạn có chắc chắn muốn hủy đơn hàng ${orderCode} không? Tiến trình này không thể hoàn tác!`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545', 
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Đồng ý hủy đơn',
                cancelButtonText: 'Giữ lại đơn'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch(`${API_URL}/api/orders/${orderId}/cancel`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' }
                    })
                    .then(res => {
                        if (!res.ok) {
                            return res.json().then(err => { throw new Error(err.error) });
                        }
                        return res.json();
                    })
                    .then(data => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Thành công',
                            text: data.message,
                            confirmButtonColor: '#198754'
                        }).then(() => {
                            // Tải lại lịch sử đơn hàng realtime để cập nhật trạng thái mới lập tức
                            window.location.reload();
                        });
                    })
                    .catch(err => {
                        Swal.fire('Lỗi hệ thống', err.message, 'error');
                    });
                }
            });
        }
    </script>
</body>
</html>

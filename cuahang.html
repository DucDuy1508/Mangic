<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">
    <link rel="stylesheet" href="./assets/css/cuahang.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons@1.0.1-alpha.3/themify-icons.min.css">
    <link rel="stylesheet" href="./assets/font/fontawesome-free-6.6.0-web/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Mangic - Cửa Hàng</title>
</head>
<body>
    <header id="header">
        <div class="header-logo">
            <a href="index.html"><img src="./assets/img/logo.png" alt="Mangic Logo" class="logo-img"></a>
        </div>
        <ul class="navbar nav-underline">
            <li class="nav-item"><a href="index.html" class="nav-link">Trang chủ</a></li>
            <li class="nav-item"><a href="cuahang.html" class="nav-link active">Cửa hàng</a></li>
            <li class="nav-item"><a href="index.html#about" class="nav-link">Giới thiệu</a></li>
            <li class="nav-item"><a href="index.html#services" class="nav-link">Dịch vụ</a></li>
            <li class="nav-item"><a href="index.html#blog" class="nav-link">Bài viết</a></li>
            <li class="nav-item"><a href="index.html#contact" class="nav-link">Liên hệ</a></li>
            <li class="nav-item"><a href="lichsu.html" class="nav-link fw-bold text-warning"><i class="ti ti-package me-1"></i>Lịch sử đơn hàng</a></li>
        </ul>
        <div class="header-control d-flex align-items-center gap-3">
            <a href="giohang.html" style="color: inherit;"><i class="header-control__icon ti ti-shopping-cart"></i></a>
            <a href="lichsu.html" class="btn btn-warning btn-sm me-2 fw-bold text-dark shadow-sm">
                <i class="ti ti-time me-1"></i> Lịch sử mua hàng
            </a>
            <a href="dangnhap.html" id="userLink" class="text-decoration-none d-flex align-items-center gap-1" style="color: #666;">
                <i class="header-control__icon ti ti-user"></i> <span>Đăng nhập</span>
            </a>
            <div id="userInfoBlock" class="d-flex align-items-center gap-2" style="display: none !important;">
                <span id="welcomeName" class="fw-bold" style="color: #ffbc00;"></span>
                <button id="btnLogout" class="btn btn-sm btn-outline-danger">Đăng xuất</button>
            </div>
        </div>
    </header>

    <div id="shop-page" class="py-5">
        <div class="container" id="product-list-container">
            </div>
    </div>

    <div id="chat-bubble" onclick="toggleChatBox()"><i class="ti ti-comment"></i></div>
    <div id="chat-box-container">
        <div class="chat-header">
            <span><i class="ti ti-headphone-alt me-2"></i> Hỗ trợ Mangic Shop</span>
            <button class="btn-close btn-close-white btn-sm" onclick="toggleChatBox()"></button>
        </div>
        <div class="chat-body d-flex flex-column gap-2" id="userChatBody"></div>
        <div class="chat-footer">
            <input type="text" id="userChatInput" class="form-control form-control-sm" placeholder="Nhập nội dung...">
            <button class="btn btn-sm btn-dark px-3 fw-bold" onclick="sendUserMessage()">Gửi</button>
        </div>
    </div>

    <style>
        #chat-bubble { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #1e1e2d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; }
        #chat-box-container { position: fixed; bottom: 95px; right: 25px; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 1000; border: 1px solid #e0e0e0; }
        .chat-header { background: #1e1e2d; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .chat-footer { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #eee; }
        .msg-box { padding: 8px 12px; border-radius: 15px; max-width: 75%; font-size: 14px; }
        .msg-wrapper { display: flex; width: 100%; margin-bottom: 5px; }
        .msg-wrapper.customer { justify-content: flex-end; }
        .msg-wrapper.customer .msg-box { background: #ffbc00; color: black; }
        .msg-wrapper.admin { justify-content: flex-start; }
        .msg-wrapper.admin .msg-box { background: #e9ecef; color: black; }
    </style>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/Js/data.js"></script> 
    <script src="./assets/Js/app.js"></script>

    <script>
        const LOGIC_SERVER = window.location.hostname === "localhost" ? "http://localhost:5000" : "https://mangic.onrender.com";
        let globalChatSocket;
        const currentLoggedUser = JSON.parse(localStorage.getItem("currentUser"));

        if (currentLoggedUser) {
            globalChatSocket = io(LOGIC_SERVER, { transports: ['polling', 'websocket'], withCredentials: true });
            globalChatSocket.emit('join_room', currentLoggedUser.username);
            globalChatSocket.on('receive_message', function(msg) { appendUserPageChatMessage(msg.sender, msg.text); });
        }

        function toggleChatBox() {
            if (!currentLoggedUser) { Swal.fire('Thông báo', 'Vui lòng đăng nhập!', 'warning'); return; }
            const chatBox = document.getElementById("chat-box-container");
            chatBox.style.display = (chatBox.style.display === "flex") ? "none" : "flex";
            if(chatBox.style.display === "flex") syncUserChatHistory();
        }

        function syncUserChatHistory() {
            fetch(`${LOGIC_SERVER}/api/chat/history/${currentLoggedUser.username}`)
            .then(res => res.json())
            .then(messages => {
                const body = document.getElementById("userChatBody");
                body.innerHTML = "";
                messages.forEach(msg => appendUserPageChatMessage(msg.sender, msg.text));
            });
        }

        function sendUserMessage() {
            const input = document.getElementById("userChatInput");
            if (!input.value.trim()) return;
            globalChatSocket.emit('send_message', { username: currentLoggedUser.username, sender: 'customer', text: input.value.trim() });
            input.value = "";
        }

        function appendUserPageChatMessage(sender, text) {
            const body = document.getElementById("userChatBody");
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}`;
            wrapper.innerHTML = `<div class="msg-box">${text}</div>`;
            body.appendChild(wrapper);
            body.scrollTop = body.scrollHeight;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Mangic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 mt-5">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center fw-bold mb-4" style="color: #222;">MANGIC LOGIN</h3>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tài khoản</label>
                                <input type="text" id="username" class="form-control" required placeholder="Nhập tài khoản (admin/khachhang)...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" id="password" class="form-control" required placeholder="Nhập mật khẩu...">
                            </div>
                            
                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Đăng Nhập</button>
                        </form>
                        
                        <div class="text-center mt-3" style="font-size: 14px;">
                            <span class="text-muted">Chưa có tài khoản?</span> 
                            <a href="dangky.html" class="text-decoration-none fw-bold text-dark ms-1">Đăng ký ngay</a>
                        </div>

                        <div class="text-center mt-2">
                            <a href="index.html" class="text-decoration-none text-muted" style="font-size: 14px;">← Quay lại trang chủ</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./assets/Js/login.js"></script>
</body>
</html>

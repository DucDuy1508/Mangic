<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng Của Bạn - Mangic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@icon/themify-icons@1.0.1-alpha.3/themify-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark fs-4" href="index.html">MANGIC SHOP</a>
            <a href="index.html" class="btn btn-sm btn-outline-dark fw-semibold">
                <i class="ti ti-arrow-left me-1"></i> Tiếp tục mua sắm
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="fw-bold mb-4"><i class="ti ti-shopping-cart me-2 text-warning"></i>Giỏ Hàng Của Bạn</h2>
        
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 45%;">Sản phẩm</th>
                                    <th style="width: 15%;">Đơn giá</th>
                                    <th style="width: 15%;" class="text-center">Số lượng</th>
                                    <th style="width: 15%;">Thành tiền</th>
                                    <th style="width: 10%;" class="text-center">Xóa</th>
                                </tr>
                            </thead>
                        </table>
                        
                        <div id="cartEmptyMessage" class="text-center py-5 d-none">
                            <i class="ti ti-shopping-cart-full fs-1 text-muted d-block mb-3"></i>
                            <p class="text-muted fw-semibold">Giỏ hàng của bạn hiện tại đang trống.</p>
                        </div>
                        
                        <table class="table align-middle">
                            <tbody id="cartTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h5 class="fw-bold border-bottom pb-3 mb-3">TÓM TẮT ĐƠN HÀNG</h5>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted">Tạm tính:</span>
                        <span id="subTotal" class="fw-semibold">0 đ</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="text-muted">Phí vận chuyển:</span>
                        <span class="fw-semibold text-end" id="shippingFeeDisplay">Đang tính...</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="fw-bold fs-5">Tổng tiền:</span>
                        <span id="cartTotal" class="fw-bold fs-4 text-danger">0 đ</span>
                    </div>
                    <button id="btnCheckout" class="btn btn-dark w-100 fw-bold py-3 fs-5">
                        TIẾN HÀNH THANH TOÁN <i class="ti ti-arrow-right ms-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-bubble" onclick="toggleChatBox()"><i class="ti ti-comment"></i></div>

    <div id="chat-box-container">
        <div class="chat-header">
            <div class="d-flex flex-column w-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span><i class="ti ti-headphone-alt me-2"></i> Hỗ trợ Mangic Shop</span>
                    <button class="btn-close btn-close-white btn-sm" onclick="toggleChatBox()"></button>
                </div>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="chatMode" id="modeAdmin" checked>
                    <label class="btn btn-sm btn-outline-warning" for="modeAdmin" onclick="setChatMode('admin')">Admin</label>
                    
                    <input type="radio" class="btn-check" name="chatMode" id="modeAI">
                    <label class="btn btn-sm btn-outline-warning" for="modeAI" onclick="setChatMode('ai')">AI Tư vấn</label>
                </div>
            </div>
        </div>
        <div class="chat-body d-flex flex-column gap-2" id="userChatBody"></div>
        <div class="chat-footer">
            <input type="text" id="userChatInput" class="form-control form-control-sm" placeholder="Nhập nội dung cần hỗ trợ...">
            <button class="btn btn-sm btn-dark px-3 fw-bold" onclick="sendUserMessage()">Gửi</button>
        </div>
    </div>

    <style>
        #chat-bubble { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #1e1e2d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: all 0.3s; }
        #chat-bubble:hover { transform: scale(1.05); background: #ffbc00; color: #1e1e2d; }
        #chat-box-container { position: fixed; bottom: 95px; right: 25px; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 1000; overflow: hidden; border: 1px solid #e0e0e0; transition: all 0.3s ease-in-out; }
        .chat-header { background: #1e1e2d; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffbc00; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 10px; }
        .chat-footer { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #eee; background: white; }
        
        .msg-box { padding: 8px 12px; border-radius: 15px; max-width: 75%; font-size: 14px; word-break: break-word; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg-wrapper { display: flex; width: 100%; margin-bottom: 2px; align-items: flex-start; }
        .msg-wrapper.customer { justify-content: flex-end; }
        .msg-wrapper.customer .msg-box { background: #ffbc00; color: black; border-bottom-right-radius: 2px; }
        .msg-wrapper.admin { justify-content: flex-start; }
        .msg-wrapper.admin .msg-box { background: #e9ecef; color: black; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; }
    </style>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        const LOGIC_SERVER = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://localhost:5000"
            : "https://mangic.onrender.com";
            
        let globalChatSocket;
        const currentLoggedUser = JSON.parse(localStorage.getItem("currentUser"));

        let currentMode = 'admin'; 
        let aiHistory = []; 

        if (currentLoggedUser) {
            globalChatSocket = io(LOGIC_SERVER, {
                transports: ['polling', 'websocket'],
                withCredentials: true
            });
            
            globalChatSocket.emit('join_room', currentLoggedUser.username);

            globalChatSocket.on('receive_message', function(msg) {
                if (currentMode === 'admin') appendUserPageChatMessage(msg.sender, msg.text);
            });
        }

        function setChatMode(mode) {
            currentMode = mode;
            const body = document.getElementById("userChatBody");
            body.innerHTML = ""; 

            if (mode === 'admin') {
                syncUserChatHistory(); 
            } else {
                aiHistory.forEach(msg => appendUserPageChatMessage(msg.sender, msg.text));
            }
        }

        function toggleChatBox() {
            if (!currentLoggedUser) {
                Swal.fire('Yêu cầu định danh', 'Vui lòng đăng nhập tài khoản để kết nối với bộ phận hỗ trợ khách hàng!', 'warning');
                return;
            }
            const chatBoxContainer = document.getElementById("chat-box-container");
            if (chatBoxContainer.style.display === "none" || chatBoxContainer.style.display === "") {
                chatBoxContainer.style.display = "flex";
                if (currentMode === 'admin') syncUserChatHistory(); 
            } else {
                chatBoxContainer.style.display = "none";
            }
        }

        function syncUserChatHistory() {
            fetch(`${LOGIC_SERVER}/api/chat/history/${currentLoggedUser.username}`)
                .then(res => res.json())
                .then(messages => {
                    const chatBody = document.getElementById("userChatBody");
                    chatBody.innerHTML = ""; 
                    messages.forEach(msg => appendUserPageChatMessage(msg.sender, msg.text));
                })
                .catch(err => console.error("Lỗi đồng bộ lịch sử đa trang:", err));
        }

        async function sendUserMessage() {
            const chatInput = document.getElementById("userChatInput");
            const textContent = chatInput.value.trim();
            if (!textContent) return;

            appendUserPageChatMessage('customer', textContent);
            chatInput.value = ""; 

            if (currentMode === 'admin') {
                globalChatSocket.emit('send_message', {
                    username: currentLoggedUser.username,
                    sender: 'customer',
                    text: textContent
                });
            } else {
                aiHistory.push({ sender: 'customer', text: textContent });
                
                const body = document.getElementById("userChatBody");
                const typingWrapper = document.createElement("div");
                typingWrapper.id = "ai-typing-indicator"; 
                typingWrapper.className = `msg-wrapper admin`;
                typingWrapper.innerHTML = `
                    <div class="msg-box" style="display: flex; align-items: center; gap: 4px; padding: 12px 15px; background: #e9ecef; border-radius: 15px; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; width: fit-content;">
                        <span style="width: 6px; height: 6px; background-color: #6c757d; border-radius: 50%; animation: ai-bounce 1.4s infinite ease-in-out both; animation-delay: -0.32s;"></span>
                        <span style="width: 6px; height: 6px; background-color: #6c757d; border-radius: 50%; animation: ai-bounce 1.4s infinite ease-in-out both; animation-delay: -0.16s;"></span>
                        <span style="width: 6px; height: 6px; background-color: #6c757d; border-radius: 50%; animation: ai-bounce 1.4s infinite ease-in-out both;"></span>
                    </div>
                    <style>
                        @keyframes ai-bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
                    </style>
                `;
                body.appendChild(typingWrapper);
                body.scrollTop = body.scrollHeight; 
                
                try {
                    const res = await fetch(`${LOGIC_SERVER}/api/ai-chat`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: textContent })
                    });
                    const data = await res.json();
                    
                    const typingElement = document.getElementById("ai-typing-indicator");
                    if (typingElement) typingElement.remove();

                    let reply = data.reply || "AI đang bận, bạn đợi chút nhé!";
                    reply = reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    reply = reply.replace(/\n/g, '<br>');
                    
                    aiHistory.push({ sender: 'admin', text: reply }); 
                    appendUserPageChatMessage('admin', reply);
                    
                } catch (err) {
                    const typingElement = document.getElementById("ai-typing-indicator");
                    if (typingElement) typingElement.remove();
                    appendUserPageChatMessage('admin', "Lỗi kết nối máy chủ AI Mangic!");
                }
            }
        }

        function appendUserPageChatMessage(sender, text) {
            const chatBody = document.getElementById("userChatBody");
            if (!chatBody) return;

            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}`;

            const msgDiv = document.createElement("div");
            msgDiv.className = "msg-box";
            msgDiv.innerHTML = text; 

            wrapper.appendChild(msgDiv);
            chatBody.appendChild(wrapper);
            
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        document.getElementById("userChatInput")?.addEventListener("keypress", function(e) {
            if (e.key === 'Enter') {
                sendUserMessage();
            }
        });
    </script>

    <script>
        const API_URL = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost"
            ? "http://localhost:5000"
            : "https://mangic.onrender.com";

        document.addEventListener("DOMContentLoaded", function() {
            const currentUser = JSON.parse(localStorage.getItem("currentUser"));
            if (!currentUser) {
                window.location.href = "dangnhap.html";
                return;
            }

            const cartKey = "cart_" + currentUser.username;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

            const tbody = document.getElementById("cartTableBody");
            const emptyMsg = document.getElementById("cartEmptyMessage");
            const cartTotalSpan = document.getElementById("cartTotal");
            const subTotalSpan = document.getElementById("subTotal");
            const shippingFeeDisplay = document.getElementById("shippingFeeDisplay");

            let shippingFee = 0;

            // Chọc API để lấy tổng chi tiêu của user hiện tại tính phí ship
            fetch(`${API_URL}/api/admin/customer-stats`)
                .then(res => res.json())
                .then(stats => {
                    const myStat = stats.find(stat => stat.username === currentUser.username);
                    const totalSpent = myStat ? myStat.totalSpent : 0;

                    // Nếu chi tiêu dưới 500k (Hạng Đồng) -> Thu 30k tiền ship
                    if (totalSpent < 500000) {
                        shippingFee = 30000;
                        shippingFeeDisplay.innerHTML = `30.000 đ`;
                        shippingFeeDisplay.className = "fw-semibold text-dark text-end";
                    } else {
                        // Từ Hạng Bạc trở lên -> Freeship
                        shippingFee = 0;
                        shippingFeeDisplay.innerHTML = `<span class="text-success"><i class="ti ti-gift me-1"></i>Miễn phí (VIP)</span>`;
                    }
                    
                    // Lấy xong phí ship mới bắt đầu render giỏ hàng
                    renderCart();
                })
                .catch(err => {
                    console.error("Lỗi lấy thông tin VIP:", err);
                    // Rớt mạng thì lấy mặc định 30k ship
                    shippingFee = 30000; 
                    shippingFeeDisplay.innerHTML = `30.000 đ`;
                    shippingFeeDisplay.className = "fw-semibold text-dark text-end";
                    renderCart();
                });

            function renderCart() {
                if (cart.length === 0) {
                    tbody.innerHTML = "";
                    emptyMsg.classList.remove("d-none");
                    cartTotalSpan.innerText = "0 đ";
                    subTotalSpan.innerText = "0 đ";
                    shippingFeeDisplay.innerHTML = "0 đ";
                    return;
                }

                emptyMsg.classList.add("d-none");
                tbody.innerHTML = "";
                let subTotalAmount = 0;

                cart.forEach((item, index) => {
                    let itemTotal = item.price * item.quantity;
                    subTotalAmount += itemTotal;

                    const row = `
                        <tr>
                            <td style="width: 45%;">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="${item.image}" alt="${item.name}" class="rounded" style="width: 50px; height: 70px; object-fit: cover;">
                                    <div>
                                        <h6 class="fw-bold mb-0 text-dark">${item.name}</h6>
                                        <small class="text-muted">Mã: ${item.id}</small>
                                    </div>
                                </div>
                            </td>
                            <td style="width: 15%;" class="fw-semibold">${item.price.toLocaleString('vi-VN')} đ</td>
                            <td style="width: 15%;">
                                <div class="d-flex justify-content-center align-items-center gap-2">
                                    <button class="btn btn-sm btn-outline-secondary px-2 btn-quantity" data-index="${index}" data-action="decrease">-</button>
                                    <span class="fw-bold px-1">${item.quantity}</span>
                                    <button class="btn btn-sm btn-outline-secondary px-2 btn-quantity" data-index="${index}" data-action="increase">+</button>
                                </div>
                            </td>
                            <td style="width: 15%;" class="fw-bold text-dark">${itemTotal.toLocaleString('vi-VN')} đ</td>
                            <td style="width: 10%;" class="text-center">
                                <button class="btn btn-sm btn-link text-danger btn-delete-item" data-index="${index}">
                                    <i class="ti ti-trash fs-5"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                // TÍNH TỔNG CỘNG TIỀN HÀNG + PHÍ SHIP
                let finalTotalAmount = subTotalAmount + shippingFee;

                subTotalSpan.innerText = subTotalAmount.toLocaleString('vi-VN') + " đ";
                cartTotalSpan.innerText = finalTotalAmount.toLocaleString('vi-VN') + " đ";

                addCartEvents();
            }

            function addCartEvents() {
                document.querySelectorAll(".btn-quantity").forEach(btn => {
                    btn.addEventListener("click", function() {
                        const index = this.getAttribute("data-index");
                        const action = this.getAttribute("data-action");

                        if (action === "increase") {
                            cart[index].quantity += 1;
                        } else if (action === "decrease") {
                            if (cart[index].quantity > 1) {
                                cart[index].quantity -= 1;
                            } else {
                                return;
                            }
                        }

                        localStorage.setItem(cartKey, JSON.stringify(cart));
                        renderCart();
                    });
                });

                document.querySelectorAll(".btn-delete-item").forEach(btn => {
                    btn.addEventListener("click", function() {
                        const index = this.getAttribute("data-index");
                        
                        Swal.fire({
                            title: 'Xóa sản phẩm?',
                            text: `Bỏ sản phẩm "${cart[index].name}" khỏi giỏ hàng?`,
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonColor: '#212529',
                            cancelButtonColor: '#6c757d',
                            confirmButtonText: 'Xóa',
                            cancelButtonText: 'Hủy'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                cart.splice(index, 1);
                                localStorage.setItem(cartKey, JSON.stringify(cart));
                                renderCart();
                            }
                        });
                    });
                });
            }

            const btnCheckout = document.getElementById("btnCheckout");
            if (btnCheckout) {
                btnCheckout.addEventListener("click", function() {
                    if (cart.length === 0) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Thông báo',
                            text: 'Giỏ hàng của bạn đang trống. Vui lòng chọn truyện trước khi thanh toán!',
                            confirmButtonColor: '#212529'
                        });
                        return;
                    }

                    // Lưu phí ship tạm để truyền sang trang thanhtoan.html
                    localStorage.setItem("tempShippingFee", shippingFee);
                    window.location.href = "thanhtoan.html";
                });
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
